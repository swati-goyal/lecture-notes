name: Daily lecture notes

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write # to commit the new notes page
  actions: write # to switch this workflow off once the playlist is finished

concurrency:
  group: daily-lecture
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Write notes for the next lecture
        id: notes
        env:
          PLAYLIST_URL: ${{ vars.PLAYLIST_URL }}
          PLAYLIST_START: ${{ vars.PLAYLIST_START }}
          NOTES_FOLDER: ${{ vars.NOTES_FOLDER || 'photonics' }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          YT_PROXY_URL: ${{ secrets.YT_PROXY_URL }}
        run: |
          if [ -z "$PLAYLIST_URL" ]; then
            echo "::error::Set the PLAYLIST_URL repository variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          python lecture_notes.py --next "$PLAYLIST_URL"

      - name: Commit and push the new page
        run: |
          git add -A "${NOTES_FOLDER}"
          if git diff --cached --quiet; then
            echo "No new notes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add lecture notes: $(git diff --cached --name-only | head -1 | xargs basename)"
          git push
        env:
          NOTES_FOLDER: ${{ vars.NOTES_FOLDER || 'photonics' }}

      - name: Stop the daily schedule (playlist finished)
        if: steps.notes.outputs.playlist_done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow disable "${{ github.workflow }}" --repo "${{ github.repository }}"
          echo "::notice::Every lecture in the playlist has notes, so this workflow is now disabled. Re-enable it on the Actions tab if new lectures are added."
